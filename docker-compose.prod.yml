services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baltex-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      NEXTAUTH_URL: http://5.63.158.177:3000
    depends_on:
      - postgres

  prisma:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dbtool
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: baltex-postgres-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: baltex-app
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
