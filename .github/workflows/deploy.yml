name: Deploy PWA Application

on:
  push:
    branches:
      - main # Скрипт срабатывает при пуше в ветку main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # ИСПРАВЛЕНО ТУТ (убрано лишнее actions/)

      - name: Deploy to Reg.ru VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          envs: DATABASE_URL,POSTGRES_PASSWORD,AUTH_SECRET
          script: |
            cd /root/baltex
            git pull origin main
            umask 077
            : "${DATABASE_URL:?GitHub secret DATABASE_URL is required}"
            : "${POSTGRES_PASSWORD:?GitHub secret POSTGRES_PASSWORD is required}"
            : "${AUTH_SECRET:?GitHub secret AUTH_SECRET is required}"
            printf 'DATABASE_URL=%s\nPOSTGRES_PASSWORD=%s\nAUTH_SECRET=%s\n' "$DATABASE_URL" "$POSTGRES_PASSWORD" "$AUTH_SECRET" > .env
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
